name: Complete draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft created by npm run release:draft
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: draft-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.inspect.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: inspect
        name: Require an unpublished candidate with a fixed source commit
        run: node scripts/ci-release.cjs inspect "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}

  firmware:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Download the private draft for verification
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-output/candidate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
      - name: Check candidate provenance
        run: node scripts/ci-release.cjs check "$RELEASE_TAG" release-output/candidate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
      - name: Install read-only image inspection tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools mtools
      - name: Verify signatures, packages, roots and branding
        run: npm run release:verify -- release-output/candidate --audit
      - name: Recreate the matching project sources
        run: python3 scripts/package-sources.py release-output/candidate/project-sources-ci.tar.gz --build-record release-output/candidate/build-inputs.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-firmware
          path: release-output/candidate/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  manager:
    needs: [candidate, firmware]
    uses: ./.github/workflows/manager-build.yml
    with:
      source-ref: ${{ needs.candidate.outputs.commit }}

  attach:
    needs: [candidate, firmware, manager]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: verified-firmware
          path: release-output/candidate
      - uses: actions/download-artifact@v4
        with:
          pattern: thing-manager-*
          merge-multiple: true
          path: release-output/candidate
      - name: Attach installers and verification results to the draft
        run: node scripts/ci-release.cjs finish "$RELEASE_TAG" release-output/candidate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
