name: Build Thing Manager preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: manager/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: npm ci --prefix manager
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal
      - name: Test native worker
        run: cargo test --locked --manifest-path manager/native/Cargo.toml
      - name: Test management and client
        if: runner.os != 'Windows'
        run: |
          npm test --prefix manager
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Test Windows discovery and controller
        if: runner.os == 'Windows'
        run: node --test manager/test/discovery.test.cjs manager/test/controller.test.cjs manager/test/build.test.cjs
      - name: Package preview
        run: npm run dist --prefix manager
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: thing-manager-${{ matrix.os }}
          path: |
            manager/dist/*.dmg
            manager/dist/*.exe
            manager/dist/*.AppImage
            manager/dist/*.deb
          if-no-files-found: error
