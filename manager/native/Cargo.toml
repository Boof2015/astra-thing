[package]
name = "astra-thing-worker"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dependencies]
flashthing = { path = "vendor/flashthing" }
rusb = { version = "0.9.4", features = ["vendored"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
crc32fast = "1.5.0"
fs2 = "0.4.3"
pollster = "1.0.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = "thin"
