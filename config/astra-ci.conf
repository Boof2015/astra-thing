# Resource settings only; the production image, packages and trust stay unchanged.
# The first run kept >10 GiB RAM available at -j 2 on a four-CPU runner.
BB_NUMBER_THREADS = "4"
PARALLEL_MAKE = "-j 4"
PARALLEL_MAKE:pn-chromium-ozone-wayland = "-j 4"
# Let rm_work reclaim these large work directories once their tasks finish.
RM_WORK_EXCLUDE:remove = "linux-superbird chromium-ozone-wayland"
# Leave space for diagnostics and the final image audit if the experiment fills up.
BB_DISKMON_DIRS = "STOPTASKS,${TMPDIR},6G,100K HALT,${TMPDIR},3G,50K"
